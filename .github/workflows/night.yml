name: GEFS night (3h in-night sampling)

# 밤 안 3시간 간격 + 변수 확장 수집 (2026-08-28).
#   · worker_night.py 가 data/night/ 에 쓴다 — worker_v2 의 data/v2 와 안 섞인다
#   · 멤버 5 · 격자 점 1개 (사용자 지시). 늘리는 것은 밤 시각과 변수뿐
#   · 재개형: 이미 받은 (cycle, lead) 는 건너뛴다 → 그냥 다시 돌리면 이어서 받는다
#
# 레인 = 멤버 5 × 기간 4분할 = 20 job. GitHub 무료 동시 상한과 딱 맞다.
#   (2026-08-30 이전에는 5분할 = 25 job 이라 마지막 멤버가 늘 대기했다.)
#
# ★ 2레인 분담 (2026-08-29) — 개인계정 + 본인 소유 Organization
#   (무료 개인계정은 1인 1개가 약관이라 두 번째 개인계정 대신 조직을 쓴다)
#     계정 A  Diu1773/kmtnet-gefs-collector       멤버 0~4
#     레인 B  pmj-seeing-lab/kmtnet-gefs-b        멤버 5~9  ← **이 저장소**
#   동시 실행 상한이 **계정마다** 20이라 둘을 합치면 40레인이 된다.
#   파일 이름이 `2021_m5.jsonl.gz` 처럼 멤버로 갈려 **섞여도 충돌이 없다.**
#
# ★ 기간을 2018-01-01 로 늘렸다 — KMTNet 시잉이 2018 부터 있기 때문이다
#   (아카이브 확인: 2015·2016·2017 은 FWHM 링크가 0개).
# 한 세션 5시간(=BUDGET_MIN 300) 뒤 스스로 커밋하고 끝난다. cron 이 다시 띄운다.
#
# ⚠ 멤버 0 만 atmos.25 를 추가로 받는다(worker_night.py fetch_unit).
#    멤버 1~30 은 산출물 2개라 작업당 비용이 2/3 다.

on:
  workflow_dispatch:
    inputs:
      budget_min:
        description: "세션 예산 (분). GitHub job 상한 6시간이라 300 권장"
        default: "300"
      workers:
        description: "동시 다운로드 스레드"
        # ⚠ 10 으로 올려 봤지만 **안 빨라졌다** (2026-08-29 실측).
        #    워커 6 = 836~991 작업/시간 · 워커 10 = 657~1025 (평균은 오히려 낮다).
        #    GitHub 러너가 4 vCPU 라 6 에서 이미 포화다. 6 으로 되돌린다.
        default: "6"
  schedule:
    - cron: "10 */6 * * *"        # 6시간마다 재개

permissions:
  contents: write

concurrency:
  group: gefs-night
  cancel-in-progress: false

jobs:
  night:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        member: [5, 6, 7, 8, 9]        # ★ 이 저장소 몫. 멤버 0~4 는 계정 A 가 받는다
        # ★ **구간 5개 → 4개** (2026-08-30). 멤버 5 × 구간 5 = 25 job 인데 무료 동시
        #   상한이 20 이라, 행렬이 멤버 기준으로 펼쳐지므로 **마지막 멤버의 5개가 항상
        #   슬롯을 못 잡고 대기**했다. 그래서 그 멤버만 5시간 늦게 시작해 한 실행이
        #   10시간을 넘겼고, 6시간 cron 이 늘 도는 실행을 만나 대기 실행이 취소됐다.
        #   (계정 A 에서 멤버 4 만 실패율 62% 로 튄 것도 여기서부터 봤다.)
        #   구간을 4개로 줄이면 5 × 4 = 20 으로 딱 맞아 전부 동시에 돌고 5시간에 끝난다.
        #   ⚠ 파일은 `{연도}_m{멤버}.jsonl.gz` 라 **구간 경계를 바꿔도 안 섞인다.**
        #     재개도 (cycle, lead) 단위라 이미 받은 것은 그대로 건너뛴다.
        # ★ **구간 4개 → 3개** (2026-09-01). 이 저장소는 20잡을 한 번에 못 받는다.
        #   실측: 2026-08-31 04:52 실행에서 **17잡이 먼저 5시간**, 남은 **3잡이 그 뒤
        #   5시간**을 따로 돌았다. 뒤쪽 5시간 동안 17슬롯이 통째로 놀았고, 그래서
        #   한 실행이 10시간을 넘겼다.
        #     평균 동시성 = (17x5 + 3x5) / 10 = **약 10잡**
        #   같은 시각 계정 A 는 20잡이 **전부 같은 분에 시작**해(한 물결) 평균 20이다.
        #   그 결과 B 의 진행률이 A 의 절반이 됐다 — m5~9 가 24~35%, m0~4 가 41~54%.
        #
        #   ⚠⚠ **위 판단은 되돌렸다** (2026-09-01, 같은 날 몇 시간 뒤).
        #   한 번 더 재 보니 **20잡이 한 물결로 도는 실행도 있었다** —
        #   실행 #33398056659 은 잡 20개가 전부 14:59 에 시작했다.
        #   17+3 이 됐던 실행(#33335180313)은 **앞 실행의 꼬리 3잡과 겹친** 때였다.
        #   즉 상한이 17 인 것이 아니라, 쪼개짐이 **스스로를 되먹임**한다 —
        #   쪼개지면 꼬리가 생기고, 꼬리가 다음 실행을 밀어 또 쪼개진다.
        #
        #   그래서 구간을 3개로 줄이면 B 를 **늘 75% 로 묶는** 셈이 된다(15/20).
        #   대신 **감시(`watchdog_night.py`)가 두 물결을 3시간마다 자동으로 잡는다.**
        #   미리 깎지 않고, 실제로 쪼개지면 그때 줄인다.
        #
        #   그리고 죽은 잡을 고친 것이 이 되먹임의 뿌리를 없앤다 —
        #   2018~2020-09 구간 잡들이 **없는 리드**를 두드리며 5시간을 태우고 있었다
        #   (`worker_night.py` 의 `V12_3H_FROM` 주석 참조). 이제 그 구간의 할 일이
        #   절반으로 줄어 잡이 예산을 다 쓰지 않고 끝난다 → 꼬리가 안 생긴다.
        #
        #   ⇒ 구간 4개(잡 20개)로 되돌리되, **경계는 연말로 유지한다**(아래 이유).
        #
        # ★★ 그리고 **경계를 연도 끝에 맞췄다.** 이게 두 번째 결함이었다.
        #   옛 경계는 2020-02-29 / 2020-03-01 과 2024-06-30 / 2024-07-01 로
        #   **연도 중간**을 지났다. 파일은 `{연도}_m{멤버}.jsonl.gz` 이므로
        #   구간 1과 2가 `2020_m{M}.jsonl.gz` 를, 구간 3과 4가 `2024_m{M}.jsonl.gz` 를
        #   **동시에 append** 했다. 두 잡이 같은 파일을 고쳐 커밋하면 git 병합이 한쪽을
        #   버린다 — `수집_운영상태.md` 가 `GEFS backfill 2024-2026 rest` 를 끈 이유와
        #   같은 사고이고, 그건 「잡은 rc=0 으로 끝나 유실을 아무도 모른다」고 적혀 있다.
        #   ⚠ 이 파일의 옛 주석은 「파일이 연도별이라 구간 경계를 바꿔도 안 섞인다」고
        #     했는데 **틀렸다.** 경계가 연도 안쪽에 있으면 정확히 섞인다.
        #
        #   아래 경계는 전부 연말이라 **한 파일을 두 잡이 건드리지 않는다.**
        #   재개는 (cycle, lead) 단위라 이미 받은 것은 그대로 건너뛴다. 마지막 구간이
        #   2024-01-01 부터로 넓어졌지만 2024 전반기는 이미 받아 둔 것이 많아 빨리 지난다.
        span:
          - { start: "2018-01-01", end: "2021-12-31" }
          - { start: "2022-01-01", end: "2023-12-31" }
          - { start: "2024-01-01", end: "2025-12-31" }
          - { start: "2026-01-01", end: "2026-08-14" }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # 얕은 클론이면 rebase 가 깨진다 (v2 수집에서 데인 것)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install --quiet herbie-data pandas numpy
      - name: Git identity
        run: |
          git config user.name "gefs-collector-bot"
          git config user.email "actions@users.noreply.github.com"
      - name: Collect
        env:
          MEMBER: ${{ matrix.member }}
          START: ${{ matrix.span.start }}
          END: ${{ matrix.span.end }}
          # ⚠ 6 → 10 을 2026-09-01 에 또 걸었다가 되돌렸다 — 위 `workers` 입력 주석에
          #    2026-08-29 실측(안 빨라짐 · 4 vCPU 라 6 에서 포화)이 이미 적혀 있었다. FAILURES 참조.
          WORKERS: ${{ inputs.workers || '6' }}
          BUDGET_MIN: ${{ inputs.budget_min || '300' }}
          # 솎지 않는다. 멤버를 10개로 줄이고 **날짜를 전부** 받는 쪽을 골랐다
          # (사용자 지시 2026-08-29: 「10멤버씩 나눠서 받는 게 테스팅도 쉽고 빨리 찬다」).
          # 얇게 31멤버보다 두껍게 10멤버가 분위수·리드·계절 분석에 쓸 수 있다.
          STRIDE: "1"
          COMMIT_EVERY: "40"
          BRANCH: master
        run: python -u worker_night.py
